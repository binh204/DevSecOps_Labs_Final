name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'juice-shop/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  security:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 40
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Docker and Docker Compose
        run: docker --version ; docker compose version

      - name: Run Semgrep (SAST)
        run: bash ./scripts/run-semgrep.ps1

      - name: Build Image
        run: bash ./scripts/build-image.ps1

      - name: Run Trivy (SCA)
        run: bash ./scripts/run-trivy.ps1

      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          docker tag juice-shop:latest ghcr.io/binh204/juice-shop:sha-$SHORT_SHA
          docker tag juice-shop:latest ghcr.io/binh204/juice-shop:latest
          docker push ghcr.io/binh204/juice-shop:sha-$SHORT_SHA
          docker push ghcr.io/binh204/juice-shop:latest

      - name: Deploy Juice Shop (Staging)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: sha-${{ env.SHORT_SHA }}
        run: bash ./scripts/deploy.ps1

      - name: Health Check
        run: bash ./scripts/health-check.ps1

      - name: Run OWASP ZAP (DAST)
        run: bash ./scripts/run-zap.ps1

      - name: Promote Image to Production Tag
        if: success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ghcr.io/binh204/juice-shop:sha-${{ env.SHORT_SHA }} ghcr.io/binh204/juice-shop:prod-latest
          docker push ghcr.io/binh204/juice-shop:prod-latest

      - name: Deploy Juice Shop (Production)
        run: bash ./scripts/deploy-public.ps1

      - name: Import Reports to DefectDojo
        if: always()
        env:
          API_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ./scripts/import-defectdojo.ps1
        
      # - name: Upload Reports
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: security-reports-${{ github.run_number }}
      #     path: reports/